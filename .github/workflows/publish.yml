name: render-and-publish

on:
  push:
    paths: ["jobs/queue/**"]       # a new job file starts a run immediately
  schedule:
    # scheduled-job check 4x a day (IST 07:47, 12:47, 18:47, 21:47), kept low to stay inside free Actions minutes
    - cron: "17 2,7,13,16 * * *"
  workflow_dispatch:
    inputs:
      job_id:
        description: "Optional: only run this job id"
        required: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Skip if queue is empty
        id: check
        run: |
          if ls jobs/queue/*.json >/dev/null 2>&1; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install FFmpeg and fonts
        if: steps.check.outputs.go == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core

      - uses: actions/setup-python@v5
        if: steps.check.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages (CPU-only torch for the 4K upscaler)
        if: steps.check.outputs.go == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache upscaler weights
        if: steps.check.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: models
          key: upscaler-realesr-general-x4v3

      - name: Render and publish
        if: steps.check.outputs.go == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_HOST: ${{ vars.IG_GRAPH_HOST }}
        run: python -m pipeline.run_queue ${{ github.event.inputs.job_id }}

      - name: Save videos for review
        if: steps.check.outputs.go == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: out/*_1080.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit job status
        if: steps.check.outputs.go == 'true' && always()
        run: |
          git config user.name "autoshorts-bot"
          git config user.email "autoshorts-bot@users.noreply.github.com"
          git add jobs
          git diff --cached --quiet || (git commit -m "Update job status [skip ci]" && git pull --rebase && git push)
